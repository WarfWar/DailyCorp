name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Clean generated sprite-atlas artifacts
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/clean_building_atlas.py

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu hosted runners already include Android SDK and sdkmanager.
      - name: Required Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.4.1 and matching export templates
        run: |
          set -euxo pipefail
          GODOT_VERSION=4.4.1
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: Restore reusable debug-signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/dailycorp-debug.keystore
          key: dailycorp-debug-key-v1

      - name: Configure Android export and debug signing
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/dailycorp-debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/dailycorp-debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=DailyCorp,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/dailycorp-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import and smoke-test game
        run: |
          godot --headless --path . --import
          godot --headless --path . --quit-after 4 2>&1 | tee /tmp/game-test.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/game-test.log; then
            exit 1
          fi

      - name: Test factory economics and purchased mine saves
        run: |
          godot --headless --path . --script res://tests/economy_smoke.gd 2>&1 | tee /tmp/economy-test.log
          grep -q "ECONOMY TEST PASSED" /tmp/economy-test.log
          if grep -E "SCRIPT ERROR|Parse Error|ECONOMY TEST FAILED" /tmp/economy-test.log; then
            exit 1
          fi

      - name: Test responsive dialogs and warehousing
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/warehouse_smoke.gd 2>&1 | tee /tmp/warehouse-test.log
          grep -q "WAREHOUSE TEST PASSED" /tmp/warehouse-test.log
          if grep -E "SCRIPT ERROR|Parse Error|WAREHOUSE TEST FAILED" /tmp/warehouse-test.log; then
            exit 1
          fi

      - name: Test real GUI taps and scrolling
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/touch_ui_smoke.gd 2>&1 | tee /tmp/input-test.log
          grep -q "TOUCH UI TEST PASSED" /tmp/input-test.log
          if grep -E "SCRIPT ERROR|Parse Error|TOUCH UI TEST FAILED" /tmp/input-test.log; then
            exit 1
          fi

      - name: Verify ore veins, transport routes, rosters, contracts and persistence
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/operations_smoke.gd 2>&1 | tee /tmp/operations-test.log
          grep -q "OPERATIONS TEST PASSED" /tmp/operations-test.log
          if grep -E "SCRIPT ERROR|Parse Error|OPERATIONS TEST FAILED" /tmp/operations-test.log; then
            exit 1
          fi

      - name: Test cinematic art textures and management navigation
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/art_smoke.gd 2>&1 | tee /tmp/art-test.log
          grep -q "ART TEST PASSED" /tmp/art-test.log
          if grep -E "SCRIPT ERROR|Parse Error|ART TEST FAILED" /tmp/art-test.log; then
            exit 1
          fi

      - name: Verify dynamic isometric world and map interaction
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/iso_world_smoke.gd 2>&1 | tee /tmp/iso-world-test.log
          grep -q "ISO WORLD TEST PASSED" /tmp/iso-world-test.log
          if grep -E "SCRIPT ERROR|Parse Error|ISO WORLD TEST FAILED" /tmp/iso-world-test.log; then
            exit 1
          fi

      - name: Verify modern console, sprite depth and parcel animation
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/visual_ui_smoke.gd 2>&1 | tee /tmp/visual-ui.log
          grep -q "VISUAL UI TEST PASSED" /tmp/visual-ui.log
          if grep -E "SCRIPT ERROR|Parse Error|VISUAL UI TEST FAILED" /tmp/visual-ui.log; then
            exit 1
          fi

      - name: Test approved bright visual integration
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/casual_art_smoke.gd 2>&1 | tee /tmp/casual-art.log
          grep -q "CASUAL ART PASSED" /tmp/casual-art.log
          if grep -E "SCRIPT ERROR|Parse Error|CASUAL ART FAILED" /tmp/casual-art.log; then
            exit 1
          fi

      - name: Verify world layout and tile visibility
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --script res://tests/world_layout_smoke.gd 2>&1 | tee /tmp/world-layout.log
          grep -q "WORLD LAYOUT PASSED" /tmp/world-layout.log
          if grep -E "SCRIPT ERROR|Parse Error|WORLD LAYOUT FAILED" /tmp/world-layout.log; then
            exit 1
          fi

      - name: Verify DailyCorp 3.0 foundation and stable geology
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/v3_foundation_smoke.gd 2>&1 | tee /tmp/v3-foundation.log
          grep -q "V3 FOUNDATION PASSED" /tmp/v3-foundation.log
          if grep -E "SCRIPT ERROR|Parse Error|V3 FOUNDATION FAILED" /tmp/v3-foundation.log; then
            exit 1
          fi

      - name: Test DailyCorp 3.0 municipal project progression
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/v3_city_contract_smoke.gd 2>&1 | tee /tmp/v3-cities.log
          grep -q "V3 CITY CONTRACT PASSED" /tmp/v3-cities.log
          if grep -E "SCRIPT ERROR|Parse Error|V3 CITY CONTRACT FAILED" /tmp/v3-cities.log; then
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DailyCorp-debug.apk
          test -s build/DailyCorp-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyCorp-debug-apk
          path: build/DailyCorp-debug.apk
          if-no-files-found: error
          retention-days: 30
