name: DailyCorp Kotlin Native Bootstrap
on:
  push:
    branches: [native-rewrite]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Expand complete Kotlin source and retain editable files
        run: |
          set -euxo pipefail
          tar -xJf bootstrap/native-source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app tests build.gradle.kts settings.gradle.kts gradle.properties .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Expand independent Kotlin Android source for DailyCorp"
            git push origin HEAD:native-rewrite
          fi
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure SDK
        uses: android-actions/setup-android@v3
      - name: Install build target
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Kotlin Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyCorp-Native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk DailyCorp-Native.apk
          TAG="native-alpha"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "DailyCorp Native Alpha" --notes "Нативный Kotlin-клиент без Godot." --prerelease
          fi
          gh release upload "$TAG" DailyCorp-Native.apk --clobber
