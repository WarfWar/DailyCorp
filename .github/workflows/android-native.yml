name: DailyCorp Native Android APK
on:
  push:
    branches: [native-rewrite]
  workflow_dispatch:
concurrency:
  group: dailycorp-native-debug-signing
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout native code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1"
      - name: Reuse native debug signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dailycorp-native-rebuilt-debug-v1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate user-supplied 132-sprite art pack
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root=Path("app/src/main/assets")
          atlas=(root/"dailycorp_resources.webp").read_bytes()
          assert atlas[:4]==b"RIFF" and atlas[8:12]==b"WEBP"
          assert struct.unpack("<I",atlas[4:8])[0]+8==len(atlas)
          info=json.loads((root/"dailycorp_sprite_map.json").read_text(encoding="utf-8"))
          sprites=info["sprites"]
          assert len(sprites)==132 and len(set(sprites.values()))==132
          for key in ("continent.meadow","continent.river","infra.road_cross",
                      "buildings.home_10","buildings.warehouse_10",
                      "buildings.university_10","mine.iron","mine.track","mine.shaft"):
              assert key in sprites, key
          print("ART ATLAS PASSED: 132 unique tiles and essential asset categories")
          PY
      - name: Validate user-supplied mining animation atlas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('app/src/main/assets/dailycorp/mine/sideview_frames.webp')
          data=p.read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert struct.unpack('<I',data[4:8])[0]+8==len(data)
          assert len(data)>1000
          print("MINER AND CART SIDEVIEW ANIMATIONS:",len(data),"bytes")
          PY
      - name: Validate HD mining frame and Style B tile atlases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          root=Path("app/src/main/assets/dailycorp/mine")
          def dimensions(path):
              data=path.read_bytes()
              assert data[:4]==b"RIFF" and data[8:12]==b"WEBP"
              assert struct.unpack_from("<I",data,4)[0]+8==len(data)
              if data[12:16]==b"VP8X":
                  w=1+int.from_bytes(data[24:27],"little")
                  h=1+int.from_bytes(data[27:30],"little")
              else:
                  start=data.find(b"\x9d\x01\x2a")
                  assert start>0
                  w=struct.unpack_from("<H",data,start+3)[0]&0x3fff
                  h=struct.unpack_from("<H",data,start+5)[0]&0x3fff
              return w,h,len(data)
          ore=dimensions(root/"style_b_blocks.webp")
          anim=dimensions(root/"sideview_frames.webp")
          assert ore[:2]==(768,768), ore
          assert anim[:2]==(768,2048), anim
          assert ore[2]>50000 and anim[2]>200000
          print("High-resolution texture pack:",ore," miner/cart animation:",anim)
          PY
      - name: Validate curated World Style B atlases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          assets=Path("app/src/main/assets/dailycorp/world")
          for name,dimensions in [("styleb_materials.webp",(512,256)),
                                  ("styleb_isometric.webp",(1024,768))]:
              data=(assets/name).read_bytes()
              assert data[:4]==b"RIFF" and data[8:12]==b"WEBP"
              assert struct.unpack_from("<I",data,4)[0]+8==len(data)
              assert data[12:16]==b"VP8X"
              width=1+int.from_bytes(data[24:27],"little")
              height=1+int.from_bytes(data[27:30],"little")
              assert (width,height)==dimensions,(name,width,height)
              print(name,width,height,len(data),"bytes")
          PY
      - name: Validate extra Style B all-ten-packs atlas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("app/src/main/assets/dailycorp/world/styleb_10_packs.webp")
          data=p.read_bytes()
          assert data[:4]==b"RIFF" and data[8:12]==b"WEBP"
          assert struct.unpack_from("<I",data,4)[0]+8==len(data)
          assert data[12:16]==b"VP8X"
          size=(1+int.from_bytes(data[24:27],"little"),
                1+int.from_bytes(data[27:30],"little"))
          assert size==(1024,1024),size
          assert 100000<len(data)<400000,len(data)
          renderer=Path("app/src/main/java/com/dailycorp/nativegame/WorldStyleBAtlas.kt").read_text()
          assert renderer.count("material.")>=8 and "nature.conifer" in renderer
          assert "site.plot_available" in renderer and "elevation.cliff" in renderer
          mine=Path("app/src/main/java/com/dailycorp/nativegame/MineBlockAtlas.kt").read_text()
          assert '"ore_tin"' in mine and '"ore_titanium"' in mine
          assert "tinFilter" in mine and "titaniumFilter" in mine
          print("STYLE B PACKS 01-10: 56 tiles, distinct tin and titanium palettes")
          PY
      - name: Run mining, transport and research unit tests
        run: gradle --no-daemon :minecore:test :app:testDebugUnitTest
      - name: Build new Kotlin Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyCorp-Native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="native-alpha"
          cp app/build/outputs/apk/debug/app-debug.apk DailyCorp-Native.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "DailyCorp Native Alpha" \
              --notes "Полностью нативный Kotlin Android клиент без Godot." --prerelease
          fi
          gh release upload "$TAG" DailyCorp-Native.apk --clobber
          echo "Published current APK directly: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DailyCorp-Native.apk"
